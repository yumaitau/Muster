packages:
  - "apps/*"
  - "packages/*"
# Allow the Next.js security releases immediately (pnpm's lockfile policy check
# ignores version-qualified entries, so these are package names).
# Keep release-age checks for all other packages.
minimumReleaseAgeExclude:
  - "next"
  - "@next/env"
  - "@next/swc-darwin-arm64"
  - "@next/swc-darwin-x64"
  - "@next/swc-linux-arm64-gnu"
  - "@next/swc-linux-arm64-musl"
  - "@next/swc-linux-x64-gnu"
  - "@next/swc-linux-x64-musl"
  - "@next/swc-win32-arm64-msvc"
  - "@next/swc-win32-x64-msvc"
onlyBuiltDependencies:
  - esbuild
  - protobufjs
  - sharp
allowBuilds:
  esbuild: true
  protobufjs: true
  sharp: true
