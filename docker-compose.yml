services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: muster
      POSTGRES_USER: muster
      POSTGRES_PASSWORD: muster
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muster -d muster"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY_ID:-minioadmin} ${STORAGE_SECRET_ACCESS_KEY:-minioadmin};
      mc mb --ignore-existing local/${STORAGE_BUCKET:-muster};
      exit 0;
      "

  trigger:
    image: ghcr.io/triggerdotdev/trigger.dev:v4
    environment:
      DATABASE_URL: postgres://muster:muster@postgres:5432/muster
      TRIGGER_SECRET_KEY: ${TRIGGER_SECRET_KEY:-tr_dev_secret}
      APP_ORIGIN: http://localhost:8030
    ports:
      - "8030:8030"
    depends_on:
      postgres:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrate
    env_file: .env.example
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    env_file: .env.example
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  ollama:
    image: ollama/ollama:0.13.0
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  postgres-data:
  minio-data:
  ollama-data:
