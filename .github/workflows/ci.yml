name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: BETTER_AUTH_SECRET=ci-placeholder-secret-change-at-runtime BETTER_AUTH_URL=http://localhost:3000 DATABASE_URL=postgres://muster:muster@localhost:5432/muster pnpm --filter @muster/web build
